[package]
name = "stagespace-tauri"
version = "0.6.4"
edition = "2021"
license = "MIT"
description = "STAGESPACE — spatial trajectory console for live OSC spatialization"
repository = "https://github.com/dewiweb/stagespace"
default-run = "stagespace-tauri"

[lib]
name = "stagespace_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stagespace-tauri"
path = "src/main.rs"

[[bin]]
name = "stagespace-cli"
path = "src/bin/stagespace-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stagespace-engines = { path = "../../rust-engines" }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
nalgebra = "0.33"
rosc = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "10"
dirs = "7.0.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
glib = "0.18"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Debuginfo réduite en dev/test : lignes seulement pour notre code
# (backtraces lisibles), aucune pour les dépendances — divise la taille
# de target/ (rlibs, .pdb) sans changer le code généré.
# Les profils ne s'appliquent qu'au crate racine : rust-engines (dépendance
# path, hors workspace) est remis explicitement en line-tables.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.stagespace-engines]
debug = "line-tables-only"
