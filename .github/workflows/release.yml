name: Release

# Déclenché sur les tags de version : git tag v0.1.0 && git push --tags
# (ou manuellement via workflow_dispatch avec un tag vX.Y.Z explicite).
# Produit les bundles Tauri (AppImage + .deb sur Linux) et crée une
# GitHub Release en draft avec les artifacts attachés.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release (vX.Y.Z) — doit exister et correspondre à tauri.conf.json version"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate : la suite CI complète doit passer sur le tag avant de builder —
  # une release sur du code non testé est la classe de bug qu'on ne shippe
  # pas (cf. AppImage/GStreamer).
  ci:
    uses: ./.github/workflows/ci.yml

  build-release:
    name: Build & Release
    needs: ci
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            bundles: deb,appimage
          # Windows/macOS unsigned fonctionnent mais affichent un
          # avertissement (SmartScreen / Gatekeeper).
          - os: macos-14
            bundles: dmg,app
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.platform.os }}

    steps:
      # Sur un push de tag : checkout du tag. Sur workflow_dispatch :
      # checkout du tag fourni en input (doit exister dans le repo).
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag + verify version matches tauri.conf.json
        # shell: bash explicite — le runner Windows utiliserait pwsh sinon
        # et la syntaxe [[ =~ ]] + jq casserait.
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' n'est pas un tag de version vX.Y.Z — rien à releaser."
            exit 1
          fi
          CONF_VERSION=$(jq -r .version tauri-app/src-tauri/tauri.conf.json)
          if [ "v$CONF_VERSION" != "$TAG" ]; then
            echo "::error::tauri.conf.json version '$CONF_VERSION' ≠ tag '$TAG' — bumper la version avant de tagger."
            exit 1
          fi
          echo "✓ Tag $TAG == tauri.conf.json version $CONF_VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Tauri + ALSA + xvfb pour le smoke test)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libfuse2 \
            xvfb \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tauri-app/frontend/package-lock.json

      # Le frontend est buildé par beforeBuildCommand (tauri.conf.json) —
      # on installe seulement les deps ici, pas de double build.
      # Le npm ci racine installe @tauri-apps/cli — tauri-action exécute
      # `npm run tauri` depuis tauri-app/, sans lui → "tauri: not found".
      - name: Install frontend dependencies
        run: |
          cd tauri-app && npm ci
          cd frontend && npm ci

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-app/src-tauri/target
            rust-engines/target
          key: release-${{ runner.os }}-${{ hashFiles('tauri-app/src-tauri/Cargo.lock', 'rust-engines/Cargo.lock') }}

      - name: Build bundles + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app
          # Bundles par plateforme — tauri.conf.json reste sur deb/appimage,
          # --bundles override la config pour macOS/Windows.
          args: --bundles ${{ matrix.platform.bundles }}
          tagName: ${{ env.TAG }}
          releaseName: 'STAGESPACE ${{ env.TAG }}'
          releaseBody: |
            Spatial trajectory engine for OSC-controlled audio renderers.
            - **AppImage** : portable, `chmod +x` puis lancer
            - **.deb** : `sudo dpkg -i stagespace_*.deb`
            - **.dmg / .app** (macOS) : non signé — clic droit → Ouvrir
            - **.msi / .nsis** (Windows) : non signé — SmartScreen → Exécuter
          releaseDraft: true
          prerelease: false

      # Smoke test post-build : le bundle ne doit pas crasher au démarrage
      # (classe de bug : dépendance système manquante type GStreamer).
      # ORDRE : tauri-action publie une DRAFT release — si ce smoke test
      # échoue, le run est rouge et la draft doit être SUPPRIMÉE, jamais
      # publiée. Rebuilder avant le smoke doublerait le temps de CI (~30 min)
      # pour un gate que le draft remplit déjà.
      - name: Smoke test bundles (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          BIN="tauri-app/src-tauri/target/release/stagespace-tauri"

          # 1. Vérifie que le binaire n'a pas de librairies manquantes
          if [ -f "$BIN" ]; then
            if ldd "$BIN" | grep -q "not found"; then
              echo "::error::Shared libraries manquantes :"
              ldd "$BIN" | grep "not found"
              exit 1
            fi
            echo "✓ Toutes les librairies du binaire sont résolues"
          fi

          # 2. Lance l'AppImage sous Xvfb — doit rester vivante ≥30s
          #    (timeout tue le process → exit 124 = succès ; crash = autre code)
          APPIMAGE=$(find tauri-app/src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::Aucun AppImage produit dans bundle/appimage"
            exit 1
          fi
          chmod +x "$APPIMAGE"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 30 "$APPIMAGE"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::error::AppImage a quitté immédiatement (exit $rc) — probable crash au démarrage"
            exit 1
          fi
          echo "✓ AppImage démarre et reste vivant (exit $rc)"

  # Si un leg de la matrix échoue (build ou smoke test), tauri-action a déjà
  # pu créer la draft release et d'autres legs continuent d'y attacher des
  # artifacts (fail-fast: false) — on obtient une draft "complète en
  # apparence" avec un bundle potentiellement cassé. Ce job supprime la draft
  # dès qu'un leg a raté : on retag + rebuild, jamais une release partielle.
  cleanup-on-failure:
    name: Delete draft release on failure
    needs: build-release
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve tag
        shell: bash
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Delete draft release (artifacts partiels jamais publiables)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$TAG" --yes || echo "No draft release to delete"
