name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Réutilisable par release.yml — une release ne part jamais sans CI verte.
  workflow_call:

# Least-privilege explicite : la CI n'écrit jamais dans le repo. Ça reste vrai
# quel que soit le "Workflow permissions" par défaut du repo (qui doit être en
# read+write pour que release.yml puisse créer des releases — voir le 403
# "Resource not accessible by integration" sur create-a-release).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ─── Rust engines (core library) ───
  rust-engines:
    name: Rust Engines
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust-engines
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies (ALSA for cpal)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engines/target
          key: rust-engines-${{ runner.os }}-${{ hashFiles('rust-engines/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (deny warnings, all targets incl. tests + benches)
        run: cargo clippy --all-targets -- -D warnings

      # Benches (engines_bench + simple_bench) are not compiled by --lib
      # test runs — this keeps them from bit-rotting.
      - name: Check benches compile
        run: cargo check --benches

      - name: Tests
        run: cargo test --lib

  # ─── Tauri app (Rust backend + commands) ───
  tauri-backend:
    name: Tauri Backend
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tauri-app/src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - name: Setup Node.js (for frontend dist)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tauri-app/frontend/package-lock.json

      - name: Build frontend (required by tauri::generate_context!)
        run: |
          cd ../frontend
          npm ci
          npm run build

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-app/src-tauri/target
            rust-engines/target
          key: tauri-backend-${{ runner.os }}-${{ hashFiles('tauri-app/src-tauri/Cargo.lock', 'rust-engines/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: "Clippy (deny warnings, all targets: lib + CLI bin + tests)"
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --lib

      # Les fichiers générés sont commités — tout drift entre les structs
      # Rust (ts-rs) et les .ts commités casse le build.
      - name: Check generated TS contracts are up-to-date
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/gen_contracts.sh
          # `git diff` ne voit que les fichiers trackés — un nouveau type
          # généré non commité passerait. `status --porcelain` attrape les
          # deux (modifiés + untracked).
          if [ -n "$(git status --porcelain -- tauri-app/frontend/src/types/generated/)" ]; then
            echo "::error::Generated TS contracts drift — run 'npm run contracts' and commit"
            git status --porcelain -- tauri-app/frontend/src/types/generated/
            exit 1
          fi

      - name: Build CLI
        run: cargo build --bin stagespace-cli

      - name: E2E CLI workflow tests
        run: bash tests/e2e_cli_test.sh

  # ─── Frontend (React + TypeScript + Vitest) ───
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tauri-app/frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tauri-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Bloquant : les erreurs font échouer le job. La dette `no-explicit-any`
      # (~470 sites : React Flow node.data, accès cross-slice Zustand) est en
      # warn dans eslint.config.js le temps de la migration typée — les warnings
      # restent visibles dans les annotations sans casser le gate.
      - name: ESLint
        run: npm run lint

      # `tsc -b` et non `tsc --noEmit` : le tsconfig racine est solution-style
      # (files: [] + references) — sans -b il ne compile RIEN et passe toujours.
      - name: TypeScript check
        run: npx tsc -b

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
