[package]
name = "morph"
version = "1.0.0"
edition = "2021"
description = "STAGESPACE plugin exemple (ABI v2) — composite : blend paramétrique entre deux trajectoires upstream"

[lib]
crate-type = ["cdylib"]

[dependencies]
stagespace-plugin-sdk = { path = "../../plugin-sdk" }
serde_json = "1.0"

[profile.release]
# Petit binaire wasm : strip + optimise taille
lto = true
opt-level = "s"
panic = "abort"
